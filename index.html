<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign UP</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <form>
    <div class="title">
<h4>Start For Free</h4>
<h2>Creat new account</h2>
    </div>
    <div class="Login">
        <p>Already A Member?</p>
        <a href="log.html">Log in</a>
    </div>
    <div class="inputs">
        <input id="first-name" type="text" placeholder="First Name" required>
        <input id="last-name" type="text" placeholder="Last Name" required>
        <input id="email" type="email" placeholder="Email" required>
    </div>
    <div class="password-box">
    <input id="password" type="password" placeholder="Password" required>
    <button type="button" id="togglePassword" onclick="show()">👁️</button>
    </div>
    <div class="socail-sign">
        <a href="https://www.facebook.com/">Facebook</a>
        <a href="https://www.instagram.com/">Instagram</a>
        <a href="https://www.google.com/">Google</a>
    </div>
    <div class="button">
        <button>Change method</button>
        <button id="creat" onclick="add()">Creat account</button>
    </div>
    </form>
    <script src="script2.js"></script>
</body>
</html>
